# JVM
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
# Configure only the projects a task needs — lets ':core:test' run on machines
# that cannot resolve the Android Gradle Plugin (e.g. restricted CI sandboxes).
org.gradle.configureondemand=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
