name: Release

# Tag a commit `v0.2.0-m1a` (etc.) and push the tag to cut a release.
# Obtainium on the phone watches this repo's Releases and offers the APK
# as an update; see docs/build-and-install.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is derived from the commit count, so the full history
          # must be present or every release would report versionCode 1.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BSCRIBE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::BSCRIBE_KEYSTORE_BASE64 secret is not set."
            echo "Without it the APK would be unsigned and uninstallable."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bscribe-release.jks"

      - name: Verify unit tests before shipping
        working-directory: android
        run: ./gradlew --no-daemon :core:test testDebugUnitTest

      - name: Assemble signed release APK
        working-directory: android
        env:
          BSCRIBE_KEYSTORE: ${{ runner.temp }}/bscribe-release.jks
          BSCRIBE_KEYSTORE_PASSWORD: ${{ secrets.BSCRIBE_KEYSTORE_PASSWORD }}
          BSCRIBE_KEY_ALIAS: ${{ secrets.BSCRIBE_KEY_ALIAS }}
          BSCRIBE_KEY_PASSWORD: ${{ secrets.BSCRIBE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Confirm the APK is actually signed
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"

      - name: Keep the runner free of key material
        if: always()
        run: rm -f "$RUNNER_TEMP/bscribe-release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
