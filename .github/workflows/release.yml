name: Release

# Tag a commit `v0.2.0-m1a` (etc.) and push the tag to cut a release.
# Obtainium on the phone watches this repo's Releases and offers the APK
# as an update; see docs/build-and-install.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is derived from the commit count and versionName from
          # the latest tag, so the full history must be present.
          fetch-depth: 0
          # :asr compiles whisper.cpp from third_party/.
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake for the native build
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BSCRIBE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::BSCRIBE_KEYSTORE_BASE64 secret is not set."
            echo "Without it the APK would be unsigned and uninstallable."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bscribe-release.jks"

      - name: Verify unit tests before shipping
        working-directory: android
        run: ./gradlew --no-daemon :core:test testDebugUnitTest

      - name: Assemble signed release APK
        working-directory: android
        env:
          BSCRIBE_KEYSTORE: ${{ runner.temp }}/bscribe-release.jks
          BSCRIBE_KEYSTORE_PASSWORD: ${{ secrets.BSCRIBE_KEYSTORE_PASSWORD }}
          BSCRIBE_KEY_ALIAS: ${{ secrets.BSCRIBE_KEY_ALIAS }}
          BSCRIBE_KEY_PASSWORD: ${{ secrets.BSCRIBE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Confirm the APK is actually signed
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          # Runners ship several build-tools versions, so an unquoted glob
          # expands to multiple paths and the extras get eaten as apksigner
          # subcommands. Pick the newest one explicitly.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Keep the runner free of key material
        if: always()
        run: rm -f "$RUNNER_TEMP/bscribe-release.jks"

      # The GitHub API exposes a tag name, not a versionCode, so the in-app
      # updater cannot tell whether a release is newer without this. Read the
      # versionCode back out of the APK rather than recomputing it, so the
      # manifest and the metadata can never disagree.
      - name: Generate update.json for the in-app updater
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging "$APK")
          VERSION_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$BADGING" | head -1)
          VERSION_NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          TAG="${GITHUB_REF_NAME}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release.apk"

          if [ -z "$VERSION_CODE" ]; then
            echo "::error::could not read versionCode from the APK"
            exit 1
          fi

          cat > update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "tag": "${TAG}",
            "apkUrl": "${APK_URL}",
            "sha256": "${SHA256}"
          }
          EOF
          cat update.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/update.json
          generate_release_notes: true
